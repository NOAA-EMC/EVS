[dir]

OUTPUT_BASE = {ENV[DATA]}

FCST_POINT_STAT_INPUT_DIR = {ENV[EVSINrrfs]}

OBS_POINT_STAT_INPUT_DIR = {ENV[EVSINrrfs]}

POINT_STAT_OUTPUT_DIR = {ENV[RUNTIME_STATS]}

LOG_DIR = {OUTPUT_BASE}/logs/{ENV[COMPONENT]}

[config]

PROCESS_LIST = PointStat
LOOP_BY = VALID

POINT_STAT_CONFIG_FILE = {PARM_BASE}/met_config/PointStatConfig_wrapped

METPLUS_CONF = {OUTPUT_BASE}/config/{ENV[COMPONENT]}/metplus_final_{ENV[MODELNAME]}_{ENV[RUN]}_{ENV[ObsType]}.conf

LOG_METPLUS = {LOG_DIR}/metplus_{ENV[MODELNAME]}_{ENV[RUN]}_{ENV[ObsType]}.log.{LOG_TIMESTAMP_TEMPLATE}

VALID_TIME_FMT = %Y%m%d%H

MODEL = {ENV[VMODEL]}

LEAD_SEQ = {ENV[fcsthours]}

VALID_BEG = {ENV[VDATE]}{ENV[vhr]}
VALID_END = {ENV[VDATE]}{ENV[vhr]}

# Increment between METplus runs in seconds. Must be >= 60
VALID_INCREMENT = 1H

################################
## The obs window dictionary  ##
################################
#
# valid time of EPA AirNOW observation is labeled at the beginning of the averaging period.
# valid time of AQM model output       is labeled at the end       of the averaging period.
#
# For matching of a hourly mean of a period [hr0,hr0+1], AQM model output valid
# time is labeled at hr0+1 Z while AirNOW obs valid time is labeled at hr0 Z.
# Thus, going back 1 hr from model valid time to match with AirNOW obs valid time
#
OBS_WINDOW_BEGIN = -3600
OBS_WINDOW_END = -3600

POINT_STAT_DESC = NA

POINT_STAT_MASK_POLY = {ENV[MASKS]}/Bukovsky_G{ENV[gridspec_conus]}_CONUS.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec_conus]}_CONUS_East.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec_conus]}_CONUS_West.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec_conus]}_CONUS_South.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec_conus]}_CONUS_Central.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_Appalachia.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_CPlains.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_DeepSouth.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_GreatBasin.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_GreatLakes.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_Mezquital.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_MidAtlantic.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_NorthAtlantic.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_NPlains.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_NRockies.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_PacificNW.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_PacificSW.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_Prairie.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_Southeast.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_Southwest.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_SPlains.nc, {ENV[MASKS]}/Bukovsky_G{ENV[gridspec]}_SRockies.nc, {ENV[MASKS]}/Alaska_G091.nc, {ENV[MASKS]}/Hawaii_G196.nc, {ENV[MASKS]}/Puerto_Rico_G194.nc

FCST_VAR1_NAME = MASSDEN
FCST_VAR1_LEVELS = Z8
FCST_VAR1_OPTIONS =  convert(x) = x * 10^9; GRIB2_ipdtmpl_index = [ 5 ]; GRIB2_ipdtmpl_val = [ 25 ]; set_attr_units = "10^-6g/m^3"; set_attr_name = "PMTF";
## Use direct record numbe such as record #1
## FCST_VAR1_LEVELS = [R01]

OBS_VAR1_NAME= PM25
OBS_VAR1_LEVELS= A1
OBS_VAR1_OPTIONS =  message_type = "AIRNOW_HOURLY_AQOBS"; censor_thresh = [ <=0.0 ]; censor_val=[ 0.0 ]; set_attr_units = "10^-6g/m^3";

## POINT_STAT_MET_CONFIG_OVERRIDES = cat_thresh = [ >5, >10, >15, >20, >25, >30, >35, >40, >45, >50, >55, >60, >65 ]; duplicate_flag = UNIQUE; obs_summary = NEAREST;
POINT_STAT_MET_CONFIG_OVERRIDES = cat_thresh = [ >5, >10, >15, >20, >25, >30, >35, >40, >45, >50, >55, >60, >65 ]; duplicate_flag = UNIQUE;

## POINT_STAT_MET_CONFIG_OVERRIDES = duplicate_flag = UNIQUE; obs_summary = NEAREST; {ENV[met_config_overrides]}

POINT_STAT_OUTPUT_FLAG_CNT = STAT
POINT_STAT_OUTPUT_FLAG_CTC = STAT
POINT_STAT_OUTPUT_FLAG_CTS = STAT
POINT_STAT_OUTPUT_FLAG_SL1L2 = STAT

POINT_STAT_INTERP_TYPE_METHOD = BILIN
POINT_STAT_INTERP_TYPE_WIDTH = 2
## for NEAREST option
## POINT_STAT_INTERP_TYPE_WIDTH = 1

POINT_STAT_REGRID_TO_GRID = NONE
POINT_STAT_REGRID_METHOD = BILIN
POINT_STAT_REGRID_WIDTH = 2
## for NEAREST option
## POINT_STAT_REGRID_WIDTH = 1

POINT_STAT_OUTPUT_PREFIX = {ENV[OutputId]}
POINT_STAT_MESSAGE_TYPE =

[filename_templates]

FCST_POINT_STAT_INPUT_TEMPLATE = {ENV[RUN]}.{init?fmt=%Y%m%d}/{ENV[MODELNAME]}/{ENV[mdl_cyc]}/{ENV[MODELNAME]}.t{ENV[mdl_cyc]}z.prslev.f{lead?fmt=%3H}.reduced.grib2

OBS_POINT_STAT_INPUT_TEMPLATE = {ENV[RUN]}.{valid?fmt=%Y%m%d?shift=-3600}/{ENV[MODELNAME]}/{ENV[ObsSrc]}_{ENV[HOURLY_INPUT_TYPE]}_{valid?fmt=%Y%m%d%H?shift=-3600}.nc

POINT_STAT_OUTPUT_TEMPLATE = {valid?fmt=%Y%m%d}.stat
