# Derive ceiling above ground level for deterministic CAM grid2obs verification.
# Use the same forecast GRIB2 file for cloud ceiling and surface height.
[dir]
METPLUS_PARM_BASE = {ENV[MET_PLUS_CONF]}
INPUT_BASE = {ENV[COMINfcst]}
CONFIG_DIR = {ENV[METPLUS_PATH]}/parm/met_config
LOG_DIR = {ENV[MET_PLUS_OUT]}/{ENV[VERIF_TYPE]}/out/logs
FCST_PCP_COMBINE_INPUT_DIR = {INPUT_BASE}
FCST_PCP_COMBINE_OUTPUT_DIR = {ENV[CEILING_AGL_DIR]}

[filename_templates]
FCST_PCP_COMBINE_INPUT_TEMPLATE = {ENV[MODEL_INPUT_TEMPLATE]}
FCST_PCP_COMBINE_OUTPUT_TEMPLATE = {ENV[CEILING_AGL_FILENAME]}

[config]
MODEL = {ENV[MODELNAME]}
LOG_PCP_COMBINE_VERBOSITY = {LOG_MET_VERBOSITY}
LOG_METPLUS = {LOG_DIR}/PCPCombine_fcst{MODEL}_{ENV[VERIF_CASE]}_{ENV[VERIF_TYPE]}_{ENV[job_name]}_for{ENV[VDATE]}{ENV[VHOUR]}_runon{CLOCK_TIME}.log
METPLUS_CONF = {ENV[MET_PLUS_OUT]}/{ENV[VERIF_TYPE]}/out/confs/PCPCombine_fcst{MODEL}_{ENV[VERIF_CASE]}_{ENV[VERIF_TYPE]}_{ENV[job_name]}_for{ENV[VDATE]}{ENV[VHOUR]}_runon{CLOCK_TIME}.conf

PROCESS_LIST = PCPCombine
FCST_PCP_COMBINE_RUN = True
OBS_PCP_COMBINE_RUN = False
FCST_PCP_COMBINE_METHOD = USER_DEFINED
FCST_PCP_COMBINE_COMMAND = -subtract {ENV[CEILING_FCST_FILE]} '{ENV[CEILING_GRIB_FIELD]}' {ENV[CEILING_FCST_FILE]} '{ENV[SURFACE_GRIB_FIELD]}'
FCST_PCP_COMBINE_OUTPUT_NAME = CEILING_AGL
FCST_PCP_COMBINE_INPUT_DATATYPE = GRIB
FCST_IS_PROB = False
PCP_COMBINE_SKIP_IF_OUTPUT_EXISTS = False
PCP_COMBINE_MANDATORY = True

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_BEG = {ENV[VDATE]}{ENV[VHOUR]}
VALID_END = {ENV[VDATE]}{ENV[VHOUR]}
VALID_INCREMENT = 24H
LEAD_SEQ = {ENV[FHR]}

INPUT_MUST_EXIST = True
OMP_NUM_THREADS = 1
DO_NOT_RUN_EXE =

